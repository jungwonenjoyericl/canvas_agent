# Copy to config.local.toml. Keep personal credentials in that ignored file.
[canvas]
base_url = "https://school.example"
# Alternatively set CANVAS_API_TOKEN in your environment.
token = ""
# Empty means all active student courses. Use Canvas course IDs to narrow it.
course_ids = []

[study]
timezone = "Europe/Stockholm"
days_ahead = 14
include_completed = false

# Used when running with --include-files (requires pip install -e ".[files]").
[files]
download_dir = "output/files"
max_file_mb = 25
max_files_per_course = 100
# Maximum PDF pages or PowerPoint slides per file.
max_pages = 300

[style]
title = "My study plan"
# Fields: checkbox, name, course, due, status, points, url, description.
# Use $$ for a literal dollar sign. Descriptions are plain text.
item_template = """
- [${checkbox}] **${name}** — ${course}
  - Due: ${due} · ${status} · Points: ${points}
  - [Open assignment](${url})
  - ${description}
"""
